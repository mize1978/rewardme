inherit_from: .rubocop_todo.yml

require:
  - rubocop-rails
  - rubocop-performance

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "db/migrate/**/*"
    - "config/**/*"
    - "vendor/**/*"
    - "node_modules/**/*"
    - "v4_basic_bug_application/**/*"  # 別プロジェクト（git submodule・独自のRuboCop設定を持つ）

# 行の長さは120文字まで許容
Layout/LineLength:
  Max: 120

# メソッド長は25行まで許容
Metrics/MethodLength:
  Max: 25

# クラス長は150行まで許容
Metrics/ClassLength:
  Max: 150

# ABCサイズは緩め
Metrics/AbcSize:
  Max: 25

# ブロック長は緩め
Metrics/BlockLength:
  Max: 40

# Railsのモデル/コントローラは日本語コメント可
Style/AsciiComments:
  Enabled: false

# frozen_string_literal はオプション
Style/FrozenStringLiteralComment:
  Enabled: false

# コードベースは Rails 標準の二重引用符で統一されているため、それに合わせる
Style/StringLiterals:
  EnforcedStyle: double_quotes

# 全クラスに doc コメントは必須としない（Rails アプリの一般的な方針）
Style/Documentation:
  Enabled: false
